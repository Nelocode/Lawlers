<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 48" width="280" height="48" fill="none">
  <defs>
    <style>
      .monogram-bg { fill: #0F172A; rx: 11; stroke: #1E293B; stroke-width: 1; }
      .monogram-inner-border { stroke: rgba(255,255,255,0.18); stroke-width: 1; rx: 10; }
      .letter-j { font-family: 'Newsreader', 'Playfair Display', 'Georgia', serif; font-size: 24px; font-weight: 600; fill: #FFFFFF; }
      .letter-e { font-family: 'Newsreader', 'Playfair Display', 'Georgia', serif; font-size: 21px; font-weight: 400; font-style: italic; fill: #94A3B8; }
      .dot-status { fill: #059669; }
      .brand-title { font-family: 'Newsreader', 'Playfair Display', 'Georgia', serif; font-size: 18.5px; font-weight: 700; fill: #0F172A; letter-spacing: 0.04em; }
      .brand-subtitle { font-family: 'Inter', system-ui, sans-serif; font-size: 8.5px; font-weight: 600; fill: #64748B; letter-spacing: 0.14em; }
    </style>
  </defs>
  <!-- Monogram Box -->
  <rect x="1" y="3" width="42" height="42" class="monogram-bg"/>
  <rect x="2" y="4" width="40" height="40" class="monogram-inner-border"/>
  <text x="13" y="32" class="letter-j">J</text>
  <text x="24" y="32" class="letter-e">E</text>
  <circle cx="36" cy="14" r="2" class="dot-status"/>

  <!-- Wordmark -->
  <text x="56" y="24" class="brand-title">JULIE M. ESSA</text>
  <text x="56" y="38" class="brand-subtitle">ABOGADA LITIGANTE · GEORGIA</text>
</svg>